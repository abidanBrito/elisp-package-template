name: Bug report

description: Report something that is broken or behaving incorrectly.
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report. Please fill in the fields below so the issue can be reproduced.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and this has not been reported yet.
          required: true
        - label: I am on the latest version.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations: { required: true }

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Ideally starting from `emacs -Q`. Include a minimal config if possible.
      placeholder: |
        1. Start `emacs -Q`.
        2. Load the package with '...'.
        3. Do '...'.
        4. See the wrong behaviour.
    validations: { required: true }

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations: { required: true }

  - type: input
    id: package-version
    attributes:
      label: Package version
      description: The package version or commit SHA you are running.
      placeholder: "0.1.0, or a commit SHA"
    validations: { required: true }

  - type: input
    id: emacs-version
    attributes:
      label: Emacs version
      description: Output of `M-x emacs-version`.
      placeholder: "GNU Emacs 30.1"
    validations: { required: true }

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your OS and any packages or settings you deem relevant to the problem.
    validations: { required: false }
